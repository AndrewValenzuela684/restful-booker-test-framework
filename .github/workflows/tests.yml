name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Run UI smoke suite
        id: ui_tests
        run: mvn -B test
        continue-on-error: true

      - name: Re-run any failed UI scenarios (handles known live-site flakiness)
        if: steps.ui_tests.outcome == 'failure'
        run: mvn -B test -Dtest=FailedRunner

      # NOTE: this step must run here, after the UI suite and before the API
      # suite below. SmokeRunner and APIRunner both write to the same file,
      # target/Cucumber.json -- APIRunner overwrites it, so this is the only
      # point where it still holds the UI/login results.
      - name: Report UI results to SpiraTeam
        if: always()
        run: python3 scripts/report_to_spira.py
        env:
          SPIRA_BASE_URL: ${{ secrets.SPIRA_BASE_URL }}
          SPIRA_PROJECT_ID: ${{ secrets.SPIRA_PROJECT_ID }}
          SPIRA_USERNAME: ${{ secrets.SPIRA_USERNAME }}
          SPIRA_API_KEY: ${{ secrets.SPIRA_API_KEY }}

      - name: Run API suite
        run: mvn -B test -Dtest=APIRunner

      - name: Upload Cucumber HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/Cucumber.html
          if-no-files-found: ignore